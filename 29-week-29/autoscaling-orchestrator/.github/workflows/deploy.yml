# ─────────────────────────────────────────────────────────
# GitHub Actions CI/CD Pipeline
# ─────────────────────────────────────────────────────────
# This pipeline runs automatically when you push to 'main'.
#
# Flow:
#   1. TEST   — Install deps, compile TypeScript, run lint
#   2. BUILD  — Build Docker image, push to AWS ECR
#   3. DEPLOY — Update Launch Template, trigger ASG refresh
#
# Required GitHub Secrets (Settings → Secrets → Actions):
#   AWS_ACCESS_KEY_ID
#   AWS_SECRET_ACCESS_KEY
#   AWS_ACCOUNT_ID
# ─────────────────────────────────────────────────────────

name: CI/CD — Build & Deploy Autoscaling Orchestrator

on:
  push:
    branches: [main]
    paths:
      - "29-week-29/autoscaling-orchestrator/**"
  pull_request:
    branches: [main]
    paths:
      - "29-week-29/autoscaling-orchestrator/**"

# ── Global environment variables ─────────────────────────
env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: autoscaling-orchestrator
  ASG_NAME: orchestrator-asg
  LAUNCH_TEMPLATE_NAME: orchestrator-template
  WORKING_DIR: 29-week-29/autoscaling-orchestrator

jobs:
  # ════════════════════════════════════════════════════════
  # JOB 1: TEST — Verify the code is valid
  # ════════════════════════════════════════════════════════
  test:
    name: 🧪 Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:
      # 1. Pull the repo code into the runner
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Install Node.js 22
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 3. Install dependencies (ci = clean install, faster in CI)
      - name: Install dependencies
        run: npm ci

      # 4. TypeScript type-checking (does NOT emit files)
      - name: Type check
        run: npx tsc --noEmit

      # 5. Run tests
      - name: Run tests
        run: npm test

  # ════════════════════════════════════════════════════════
  # JOB 2: BUILD — Create Docker image & push to ECR
  # ════════════════════════════════════════════════════════
  build-and-push:
    name: 🐳 Build & Push Docker Image
    needs: test # Only runs if tests pass!
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Authenticate with AWS
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Login to AWS Elastic Container Registry (private Docker registry)
      - name: Login to AWS ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Build the Docker image and push it with two tags:
      #   1. The git commit SHA (unique, immutable)
      #   2. "latest" (always points to the newest build)
      - name: Build, Tag & Push Docker Image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker tag $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $REGISTRY/$ECR_REPOSITORY:latest
          docker push $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $REGISTRY/$ECR_REPOSITORY:latest
          echo "image=$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

  # ════════════════════════════════════════════════════════
  # JOB 3: DEPLOY — Roll out the new image via ASG
  # ════════════════════════════════════════════════════════
  deploy:
    name: 🚀 Deploy to ASG
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Update the Launch Template's User Data to pull the new image
      - name: Update Launch Template User Data
        run: |
          USER_DATA=$(cat <<'SCRIPT' | base64 -w 0
          #!/bin/bash
          set -e
          # Install Docker if missing
          if ! command -v docker &> /dev/null; then
            apt-get update && apt-get install -y docker.io
            systemctl enable docker && systemctl start docker
          fi
          # Login to ECR
          aws ecr get-login-password --region ${{ env.AWS_REGION }} | \
            docker login --username AWS --password-stdin \
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com
          # Pull and run the latest image
          docker pull ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:latest
          docker run -d -p 3000:3000 --restart unless-stopped \
            --name autoscaling-orchestrator \
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:latest
          SCRIPT
          )

          aws ec2 create-launch-template-version \
            --launch-template-name ${{ env.LAUNCH_TEMPLATE_NAME }} \
            --source-version '$Latest' \
            --launch-template-data "{\"UserData\":\"$USER_DATA\"}"

      # Tell the ASG to replace old instances one at a time
      - name: Trigger Instance Refresh
        run: |
          aws autoscaling start-instance-refresh \
            --auto-scaling-group-name ${{ env.ASG_NAME }} \
            --preferences '{"MinHealthyPercentage":50}'
          echo "✅ Instance refresh started — rolling deployment in progress!"
