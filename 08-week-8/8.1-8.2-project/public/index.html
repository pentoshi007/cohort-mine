<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Selling App</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="container nav-wrapper">
            <a href="/" class="logo">CourseApp</a>
            <nav class="nav-links" id="navLinks">
                <!-- Injected by JS -->
            </nav>
        </div>
    </header>

    <main class="container">
        <div class="hero" style="padding: 4rem 0; text-align: center;">
            <h1 style="font-size: 3rem; margin-bottom: 1rem; font-weight: 800; letter-spacing: -0.05em;">Master New Skills Today</h1>
            <p style="font-size: 1.25rem; color: var(--text-light); margin-bottom: 2rem; max-width: 600px; margin-left: auto; margin-right: auto;">
                Browse our collection of premium courses designed to help you advance your career.
            </p>
        </div>

        <h2 style="margin-bottom: 1.5rem;">Featured Courses</h2>
        <div id="courseGrid" class="grid">
            <!-- Courses injected here -->
            <div style="grid-column: 1/-1; text-align: center; padding: 2rem; color: var(--text-light);">
                Loading courses...
            </div>
        </div>
    </main>

    <div id="toast" class="toast"></div>
    <script src="script.js"></script>
    <script>
        // Page specific logic
        document.addEventListener('DOMContentLoaded', () => {
            loadCourses();
        });
    </script>
</body>
</html>
